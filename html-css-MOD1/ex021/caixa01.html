<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1{
            background-color: lightpink;
            height: 300px;
            width: 300px;

            border: 10px solid palevioletred;

            padding: 10px;

            margin: 20px auto 40px auto;

            outline: 5px dashed chocolate;

        }

        a{
            border-width: 4px;
            border-style: dashed;
            border-color: red;
            
            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafros também são exemplos de box-level, mas os <a href="@"> links também são exemplos de inline-levels</a> vamos ver como isso funciona</p>
</body>
</html>
